<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#101a3c;color:#fff;font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif}
#app{height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding-top:env(safe-area-inset-top)}
#top{display:flex;align-items:center;gap:5px;padding:6px;background:linear-gradient(#3a6fd8,#1c3f94);border-bottom:3px solid #0a1734;box-shadow:inset 0 2px 0 #fff5}

.xp{height:6px;background:#0a1734;border-radius:9px;overflow:hidden}.xp i{display:block;height:100%;background:linear-gradient(#9ff06a,#3aa81e)}

#arena{position:relative;height:clamp(250px,calc(100dvh - 430px),430px);background:#3a6 center 70%/cover;border-bottom:4px solid #0a1734;overflow:hidden;flex:none}
#arena:before{content:'';position:absolute;inset:0;background:linear-gradient(#0005,#0000 30%,#0000 70%,#0006)}
.stg{position:absolute;top:6px;left:0;right:0;text-align:center;font-weight:900;font-size:14px;text-shadow:0 2px 0 #0a1734,0 0 4px #000;z-index:3}
.bossb{background:linear-gradient(#ff5a4a,#c42a20);border:2px solid #0a1734;border-radius:8px;padding:0 6px;font-size:11px}
.side{position:absolute;bottom:58px;width:48%;z-index:2}.side.l{left:2%}.side.r{right:2%}
.bar{position:relative;height:14px;background:#0a1734;border:2px solid #0a1734;border-radius:99px;overflow:hidden;margin:0 6% 2px}
.bar i{display:block;height:100%;background:linear-gradient(#9ff06a,#3aa81e);transition:width .15s}.bar.e i{background:linear-gradient(#ff8a7a,#d02a1a)}

.unit{height:calc(var(--ah,300px)*.42);display:flex;align-items:flex-end;justify-content:center}
.unit img{height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 4px 3px #0008);animation:bob 1.6s ease-in-out infinite}
.unit.boss img{height:125%}.unit.flip img{transform:scaleX(-1)}
.unit.atk img{animation:lunge .25s}.unit.hit img{animation:hit .25s}
@keyframes bob{50%{transform:translateY(-4px)}}@keyframes lunge{50%{transform:translateX(14px)}}@keyframes hit{30%{transform:translateX(8px);filter:brightness(2.2) drop-shadow(0 0 4px red)}}
.flip.hit img{animation:none}
.pets{position:absolute;left:-2%;bottom:-6px;display:flex;gap:0}
.pu{width:46px;height:42px;margin-right:-8px}.pu img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 2px #0008);animation:bob 1.2s ease-in-out infinite}
.pu.st1{transform:scale(1.15)}.pu.st2{transform:scale(1.3);filter:drop-shadow(0 0 6px #ffd54a)}
.fn{text-align:center;font-size:11px;font-weight:900;text-shadow:0 1px 0 #000,0 0 3px #000}
.fx{position:absolute;z-index:5;font-weight:900;font-size:19px;pointer-events:none;animation:up .9s forwards;text-shadow:0 2px 0 #000}
.fx.dmg{color:#fff}.fx.hurt{color:#ff7a6a;font-size:15px}.fx.heal{color:#8ef05a}
@keyframes up{to{transform:translateY(-40px);opacity:0}}
#quest{position:absolute;left:6px;top:28px;z-index:4;max-width:58%;text-align:left;background:linear-gradient(#fff8e0,#f0d89a);color:#3a2408;border:2.5px solid #0a1734;border-radius:12px;padding:3px 8px;box-shadow:0 3px 0 #0008;font-family:inherit}
#quest b{font-size:11px;display:block}#quest span{font-size:11px}
.skills{position:absolute;bottom:4px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:4}
.sk{--cd:0;width:50px;height:50px;border-radius:50%;border:3px solid #0a1734;background:radial-gradient(circle at 50% 30%,#ffe98a,#f0a018 60%,#b86a08);position:relative;overflow:hidden;box-shadow:inset 0 2px 0 #fffa,0 3px 0 #0009;color:#fff;font-family:inherit}
.sk:after{content:'';position:absolute;inset:0;background:#000a;transform:scaleY(var(--cd));transform-origin:bottom}
.sk span{font-size:20px;display:block;line-height:24px}.sk small{font-size:7.5px;font-weight:900;display:block;text-shadow:0 1px 0 #000;position:relative;z-index:1}
.sk.au{background:radial-gradient(circle at 50% 30%,#bfe0ff,#3a8cf0 60%,#1d5cc0)}.sk.au.on{background:radial-gradient(circle at 50% 30%,#d0ffb0,#4cb82a 60%,#2f9418)}.sk.au:after{display:none}
#panel{flex:1;min-height:0;overflow-y:auto;padding:7px;background:linear-gradient(#2a5bb0,#18397a 60%,#122c60);box-shadow:inset 0 3px 0 #fff3}
nav{display:flex;gap:3px;padding:4px 3px calc(4px + env(safe-area-inset-bottom));background:linear-gradient(#1f4a9e,#102a60);border-top:3px solid #0a1734;flex:none}
nav button{flex:1;position:relative;height:56px;border:2.5px solid #0a1734;border-radius:12px;background:linear-gradient(#3b66b4,#22437f);color:#fff;font:900 10.5px inherit;font-family:inherit;box-shadow:inset 0 2px 0 #fff4,0 3px 0 #0009;text-shadow:0 1px 0 #000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
nav button img{height:28px;width:34px;object-fit:contain;filter:drop-shadow(0 2px 0 #0008)}
nav button.on{background:linear-gradient(#9ff06a,#4cb82a 60%,#2f9418);transform:translateY(-3px);box-shadow:inset 0 2px 0 #fffa,0 0 0 2px #ffd54a,0 3px 0 #0009}
nav button.dot:after{content:'';position:absolute;top:-3px;right:-2px;width:11px;height:11px;border-radius:50%;background:#ff3a2a;border:2px solid #fff}
.btn{display:block;width:100%;border:3px solid #0a1734;border-radius:14px;padding:9px 6px;margin:4px 0;color:#fff;font:900 14px inherit;font-family:inherit;text-shadow:0 2px 0 #0007;
 background:linear-gradient(#8aa0c8,#5a6f98);box-shadow:inset 0 3px 0 #fff8,inset 0 -4px 0 #0003,0 4px 0 #0a1734}
.btn:active{transform:translateY(3px);box-shadow:inset 0 3px 0 #fff8,0 1px 0 #0a1734}
.btn.g{background:linear-gradient(#8ee45a,#4cb82a 55%,#2f9418)}.btn.y{background:linear-gradient(#ffd54a,#f0a018 55%,#d6800c)}.btn.b{background:linear-gradient(#6fb4ff,#2f7ae6 55%,#1d5cc0)}.btn.r{background:linear-gradient(#ff7a6a,#e2382a 55%,#b8221a)}
.btn.big{font-size:16px;padding:11px 6px}.btn.sm{font-size:12px;padding:6px 4px}.btn:disabled{filter:grayscale(.85) brightness(.8)}
.row2,.b2{display:flex;gap:6px}.row2>*,.b2>*{flex:1}
.card{background:linear-gradient(#fff,#e4ecfb);color:#13254a;border:3px solid #0a1734;border-radius:14px;padding:6px 8px;margin:4px 0;box-shadow:inset 0 -3px 0 #b9c8e6,0 3px 0 #0007;font-size:12px}
.kv{display:flex;justify-content:space-between;gap:6px;margin:1px 0}
.gear{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.slot{aspect-ratio:1;border:2.5px solid #0a1734;border-radius:12px;background:linear-gradient(#e8eef8,#b8c6de);box-shadow:inset 0 2px 0 #fff8,0 3px 0 #0007;position:relative;padding:3px;font-family:inherit}

.r0{--rc:#9aa7b8}.r1{--rc:#55c24a}.r2{--rc:#3a8cf0}.r3{--rc:#a650f0}.r4{--rc:#ff9a1a}
.slot[class*=" r"],.pcard{background:radial-gradient(circle at 50% 35%,#fff9,var(--rc) 70%)}
.tick{font-size:11px;background:#0a1a3c88;border-radius:9px;padding:4px 7px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:0 2px 5px;text-shadow:0 1px 0 #000}.hd span{font-size:11px;opacity:.9}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.hgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0}
.pcard{border:2.5px solid #0a1734;border-radius:12px;padding:3px 2px;color:#fff;font-family:inherit;box-shadow:inset 0 2px 0 #fff6,0 3px 0 #0007;text-shadow:0 1px 0 #000;min-width:0}
.pcard img,.pcard .ph{width:100%;height:48px;object-fit:contain;display:block;font-size:28px}.pcard b{font-size:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pcard small{font-size:9px}
.pcard.in{outline:3px solid #ffd54a;outline-offset:-1px}
.pbig{width:120px;height:110px;margin:0 auto;border-radius:16px;border:3px solid #0a1734;background:radial-gradient(circle,#fff9,var(--rc) 70%)}.pbig img{width:100%;height:100%;object-fit:contain}
.ctr{text-align:center;font-size:12px;margin:4px 0}
.nest{height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center}.egg{font-size:64px;animation:bob 1.4s infinite;filter:drop-shadow(0 4px 4px #0008)}

.task{display:flex;align-items:center;gap:6px;background:linear-gradient(#fff,#e4ecfb);color:#13254a;border:2.5px solid #0a1734;border-radius:12px;padding:2px 3px 2px 8px;margin:4px 0;font-size:12px}

.chat{background:#0a1a3c88;border-radius:10px;padding:5px 7px;font-size:11.5px;height:calc(100% - 150px);min-height:60px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.chat b{color:#ffd54a}.cin{display:flex;gap:5px;margin-top:5px}.cin input{flex:1;border:2.5px solid #0a1734;border-radius:10px;padding:6px;font:13px inherit;user-select:text}.cin .btn{width:70px;margin:0}
.shop{display:flex;align-items:center;gap:7px;background:linear-gradient(#fff,#e4ecfb);color:#13254a;border:2.5px solid #0a1734;border-radius:12px;padding:1px 3px 1px 6px;margin:3px 0}
.shop .si{font-size:22px}.shop div{flex:1;font-size:12px}.shop small{display:block;font-size:10px;opacity:.75}.shop .btn{width:74px;margin:2px 0}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20;padding:12px}#modal.on{display:flex}
#mbody{width:100%;max-width:400px;max-height:94dvh;overflow:auto;background:linear-gradient(#2f66c4,#173a80);border:4px solid #0a1734;border-radius:18px;padding:10px;box-shadow:inset 0 3px 0 #fff5,0 0 0 3px #ffd54a,0 10px 30px #000c}

.cmp{display:flex;gap:6px}.icard{flex:1;min-width:0;border:3px solid #0a1734;border-radius:14px;padding:5px;background:linear-gradient(#8a9ab8,#5a6a88);font-size:11px;text-shadow:0 1px 0 #0009}
.icard.r1{background:linear-gradient(#6cc84a,#3a8a24)}.icard.r2{background:linear-gradient(#4a9cf0,#1f5cc0)}.icard.r3{background:linear-gradient(#b86af0,#7a2ec0)}.icard.r4{background:linear-gradient(#ffc24a,#e07a10)}
.ilab{font-size:10px;font-weight:900;opacity:.9}.ihd{display:flex;gap:5px;align-items:center;margin:2px 0 4px}.ihd img,.ihd .ph{width:40px;height:40px;object-fit:contain;font-size:26px}.ihd b{font-size:12px;display:block}.ihd small{font-size:10px}
.emp{text-align:center;padding:30px 0;opacity:.7}
.srw{display:flex;justify-content:space-between;background:#0a1a3c66;border-radius:6px;margin:2px 0;padding:3px 6px;font-size:11px}.srw em{font-style:normal;margin-left:3px}.up{color:#9fff6a}.dn{color:#ffb0a4}

#toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-20px);opacity:0;transition:.25s;z-index:30;background:linear-gradient(#2f66c4,#173a80);border:3px solid #0a1734;border-radius:14px;padding:6px 12px;font-weight:900;font-size:13px;box-shadow:0 0 0 2px #ffd54a,0 4px 0 #0008;white-space:nowrap;pointer-events:none}
